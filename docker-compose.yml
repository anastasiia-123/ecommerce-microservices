version: '3.8'

services:
  nginx-gateway:
    image: nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - catalog-service
      - order-service

  catalog-service:
    build: ./services/catalog-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001

  order-service:
    build: ./services/order-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - CATALOG_SERVICE_URL=http://catalog-service:3001